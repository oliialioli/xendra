<!doctype html>
<html lang="eu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4c4032" />
    <!--
      Title, description, canonical address, link-preview tags and structured
      data: written per page (the map and each section) from the site's own
      content, see src/seo/siteSeo.ts and the plugin in vite.config.ts.
    -->
    <!--seo:head-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Before the app's code has arrived: the intro's kraft paper, the cream logo and a gently pulsing line. */
      #initial-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font: 600 1.05rem 'Instrument Sans', system-ui, sans-serif;
        color: #ebdfca;
        background: #4c4032;
      }
      #initial-loading img {
        width: min(220px, 60vw);
        height: auto;
      }
      #initial-loading .line {
        width: min(240px, 64vw);
        height: 2px;
        background: repeating-linear-gradient(90deg, rgb(215 198 175 / 45%) 0 6px, transparent 6px 12px);
        position: relative;
        overflow: hidden;
      }
      #initial-loading .line::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 30%;
        background: #ebdfca;
        animation: initial-loading-run 1.4s ease-in-out infinite;
      }
      @keyframes initial-loading-run {
        from { transform: translateX(-100%); }
        to { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loading .line::after { animation: none; width: 100%; }
      }
      /* The site's content as plain text, under the loading screen: for crawlers that don't run the app (it replaces all of #root as it starts). */
      #static-summary {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px;
        font: 1rem/1.5 'Instrument Sans', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loading" role="status">
        <img src="/assets/brand/xendra-logo-cream.svg" alt="Xendra" />
        <div class="line" aria-hidden="true"></div>
        <span><!--seo:loading--></span>
      </div>
      <!--seo:summary-->
    </div>
    <noscript>
      <style>#initial-loading { display: none; }</style>
      <p><!--seo:noscript--></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
